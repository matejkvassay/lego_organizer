services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]   # local only; do not expose on the network
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/lego.db
    volumes:
      - lego-data:/data   # named volume: a host folder would need chown to uid 10001 (the non-root app user)

volumes:
  lego-data:
