name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the deploy workflow runs the same checks first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit
      - name: Scan for committed secrets (gitleaks)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lego-organizer .
      - name: Smoke test the image
        run: |
          # A one-off command must run itself and exit (not start the web server).
          docker run --rm lego-organizer python -c "print('command passthrough ok')"
          docker run -d --name app -p 8000:8000 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" -e ALLOWED_EMAIL=ci@example.com \
            -e BASE_URL=http://localhost:8000 lego-organizer
          for _ in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          echo
          curl -fs localhost:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/items)" = 401
          docker logs app
